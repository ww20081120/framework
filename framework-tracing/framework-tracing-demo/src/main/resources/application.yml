project: #项目信息
  name: log-demo

spring: #应用配置
  application:
    name: ${project.name}

server: #系统配置
  port: 10000

management:
  tracing:
    sampling:
      probability: 1.0

# OpenObserve OTLP配置
otlp:
  enabled: true
  # 统一端点地址，路径后缀（/v1/traces、/v1/logs、/v1/metrics）由代码自动拼接
  endpoint: http://localhost:5080/api/default
  # 是否保留本地trans.log输出（默认false，仅通过OTLP发送到OpenObserve）
  local-trace-enabled: false
  # 推荐使用http协议，gRPC在Java OTel SDK中存在认证头传递问题
  protocol: http
  # Basic认证（格式：Basic base64(username:password)）
  authorization: Basic d3cyMDA4MTEyMEAxMjYuY29tOm8yb2lfZlk3UnU1cmJpY0RkMG50MDYwTVBYZFRUZGpwVWRoQVg=
  organization: default
  stream-name: default
